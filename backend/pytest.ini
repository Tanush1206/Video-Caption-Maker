[pytest]
asyncio_mode = auto
# The editable install can't register the `app` package (the Dockerfile installs
# deps before COPY, so setuptools finds no packages), so put rootdir on sys.path.
pythonpath = .
# One event loop for the whole session. The SQLAlchemy engine and the Redis
# client are module-level singletons bound to the loop that created them, so a
# per-test loop leaves every later test talking to a closed loop.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
