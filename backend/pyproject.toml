[project]
name = "videocaptionmaker-backend"
version = "0.1.0"
description = "AI-powered video captioning & transcript search backend"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.2.0",  # backs pydantic's EmailStr

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Background tasks
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    # bcrypt directly, not via passlib: passlib 1.7.4 (2020, unmaintained)
    # probes the backend with an over-length test password, which bcrypt >= 5
    # rejects instead of truncating, breaking every hash call.
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "httpx>=0.27.0",

    # AI / ML — installed but not all wired up until their respective milestones
    "faster-whisper>=1.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    # Optional: only used when a Gemini key is set in Settings.
    "google-genai>=0.1.0",
    # Tokenizer for the local M2M100 translator (CTranslate2 comes with
    # faster-whisper).
    "sentencepiece>=0.2.0",

    # Fonts. Google ships its most popular families as variable fonts only, and
    # libass takes the default instance and fakes a bold while the browser
    # interpolates a real one — the preview disagreeing with the export. This
    # pins the axes and writes a genuine static cut, which both renderers then
    # read from the same file.
    "fonttools>=4.53.0",

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Only the CUDA image installs these (backend/Dockerfile, VARIANT=cuda), at the
# exact versions verified on an RTX 5080. In the default dependencies they put
# 2.2 GB of GPU libraries into the CPU image too.
cuda = [
    # faster-whisper's CTranslate2 backend is built against CUDA 12, while
    # torch installs CUDA 13 wheels. The two runtimes coexist (different
    # sonames); without these, transcription fails at inference with
    # "Library libcublas.so.12 is not found or cannot be loaded".
    # 12.8+ is required for Blackwell (sm_120) support.
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.24.0.43",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
