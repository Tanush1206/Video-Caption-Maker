services:
  postgres:
    image: postgres:16-alpine
    container_name: vcm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vcm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vcm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vcm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: vcm_chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vcm}:${POSTGRES_PASSWORD:-vcm_dev_password}@postgres:5432/${POSTGRES_DB:-vcm}
      REDIS_URL: redis://redis:6379/0
      CHROMADB_URL: http://chromadb:8000
      # Same inotify limitation as the frontend — uvicorn --reload needs polling.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_storage:/app/storage
      # The caption fonts, shared with the frontend rather than copied.
      # libass and the browser must render the same face, and the surest
      # way to guarantee that is for both to read the same bytes. Under
      # /usr/share/fonts so fontconfig picks it up without extra config.
      - ./frontend/public/fonts:/usr/share/fonts/truetype/vcm:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcm_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vcm}:${POSTGRES_PASSWORD:-vcm_dev_password}@postgres:5432/${POSTGRES_DB:-vcm}
      REDIS_URL: redis://redis:6379/0
      CHROMADB_URL: http://chromadb:8000
    volumes:
      - ./backend:/app
      - media_storage:/app/storage
      # The caption fonts, shared with the frontend rather than copied.
      # libass and the browser must render the same face, and the surest
      # way to guarantee that is for both to read the same bytes. Under
      # /usr/share/fonts so fontconfig picks it up without extra config.
      - ./frontend/public/fonts:/usr/share/fonts/truetype/vcm:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --pool=solo: one task at a time. Whisper loads a multi-GB model onto the
    # GPU, so concurrent workers would each want their own copy and exhaust
    # VRAM. Transcription is GPU-bound anyway; parallelism buys nothing here.
    command: celery -A app.workers.celery_app worker --loglevel=info --pool=solo
    # GPU passthrough for faster-whisper. Docker Desktop's WSL2 backend
    # provides this through the Windows NVIDIA driver — no separate
    # nvidia-container-toolkit install is needed on this setup.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vcm_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Windows bind mounts don't deliver inotify events into the container,
      # so the dev-server file watcher must poll to see host edits.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  media_storage:
