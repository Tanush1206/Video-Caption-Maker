services:
  postgres:
    image: postgres:16-alpine
    container_name: vcm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vcm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vcm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-vcm}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vcm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vcm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    container_name: vcm_chromadb
    restart: unless-stopped
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcm_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vcm}:${POSTGRES_PASSWORD:-vcm_dev_password}@postgres:5432/${POSTGRES_DB:-vcm}
      REDIS_URL: redis://redis:6379/0
      CHROMADB_URL: http://chromadb:8000
      # Same inotify limitation as the frontend — uvicorn --reload needs polling.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - media_storage:/app/storage
      # The caption fonts, shared with the frontend rather than copied.
      # libass and the browser must render the same face, and the surest
      # way to guarantee that is for both to read the same bytes. Under
      # /usr/share/fonts so fontconfig picks it up without extra config.
      - ./frontend/public/fonts:/usr/share/fonts/truetype/vcm:ro
      # Google Fonts fetched on demand. Read-write here and in the worker, and
      # a named volume rather than a bind mount: 618MB of downloadable faces
      # has no business in the repository, and the cache is derived data that
      # can be thrown away and refetched.
      - font_cache:/usr/share/fonts/truetype/vcm-cache
      # Whisper's weights, on a volume so they survive the container.
      #
      # They were living in the container's writable layer, so every `compose
      # up` that recreated a service threw away 4.4GB and downloaded it again —
      # and `large-v3` is 3GB of that on its own. Nothing about model weights is
      # per-container; they are the same bytes for the life of the image, and
      # sharing one volume means the two services never hold two copies.
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vcm_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vcm}:${POSTGRES_PASSWORD:-vcm_dev_password}@postgres:5432/${POSTGRES_DB:-vcm}
      REDIS_URL: redis://redis:6379/0
      CHROMADB_URL: http://chromadb:8000
      # `video` is the one that matters here, and it is not implied.
      #
      # `capabilities: [gpu]` below gets the container `compute` and `utility`,
      # which is enough for nvidia-smi to print the card and for faster-whisper
      # to use CUDA — so the GPU looks fully available. It is not:
      # libnvidia-encode.so.1 lives behind the `video` capability, and without
      # it every NVENC encoder is listed by ffmpeg and fails the moment it is
      # opened ("Cannot load libnvidia-encode.so.1", followed by a misleading
      # complaint about the driver being too old).
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ./backend:/app
      - media_storage:/app/storage
      # The caption fonts, shared with the frontend rather than copied.
      # libass and the browser must render the same face, and the surest
      # way to guarantee that is for both to read the same bytes. Under
      # /usr/share/fonts so fontconfig picks it up without extra config.
      - ./frontend/public/fonts:/usr/share/fonts/truetype/vcm:ro
      # Google Fonts fetched on demand. Read-write here and in the worker, and
      # a named volume rather than a bind mount: 618MB of downloadable faces
      # has no business in the repository, and the cache is derived data that
      # can be thrown away and refetched.
      - font_cache:/usr/share/fonts/truetype/vcm-cache
      # Whisper's weights, on a volume so they survive the container.
      #
      # They were living in the container's writable layer, so every `compose
      # up` that recreated a service threw away 4.4GB and downloaded it again —
      # and `large-v3` is 3GB of that on its own. Nothing about model weights is
      # per-container; they are the same bytes for the life of the image, and
      # sharing one volume means the two services never hold two copies.
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --pool=solo: one task at a time. Whisper loads a multi-GB model onto the
    # GPU, so concurrent workers would each want their own copy and exhaust
    # VRAM. Transcription is GPU-bound anyway; parallelism buys nothing here.
    #
    # Wrapped in watchfiles because Celery has no --reload of its own, and the
    # failure that causes is silent and expensive: the worker goes on running
    # whatever code it imported at boot, so edits appear to have no effect at
    # all. That is exactly what happened to the language selector — the choice
    # was stored correctly and the worker transcribing it had never heard of
    # the field. `task_acks_late` makes a restart mid-task safe: the job is
    # redelivered rather than lost.
    #
    # Watching app/ rather than /app: the latter holds storage/, so every
    # upload would bounce the worker and drop the multi-GB model off the GPU.
    # watchfiles ships with uvicorn[standard], so this adds no dependency.
    command: >
      watchfiles --filter python
      "celery -A app.workers.celery_app worker --loglevel=info --pool=solo"
      /app/app
    # GPU passthrough for faster-whisper. Docker Desktop's WSL2 backend
    # provides this through the Windows NVIDIA driver — no separate
    # nvidia-container-toolkit install is needed on this setup.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vcm_frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Windows bind mounts don't deliver inotify events into the container,
      # so the dev-server file watcher must poll to see host edits.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: npm run dev

volumes:
  model_cache:
  postgres_data:
  redis_data:
  chroma_data:
  media_storage:
  font_cache:
