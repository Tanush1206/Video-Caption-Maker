# The app on ARM, natively (v1.4.0; emulated from v1.2.1 until then).
#
# On GitHub's arm64 Linux runner, and on an amd64 one for comparison,
# scripts/ci_arch_check.sh builds this commit's CPU images natively, serves
# them from a local registry and this commit's compose files and `vcm` as a
# release, runs the real install.sh, checks every container runs as the
# runner's architecture, and times a short transcription that uses every
# engine (faster-whisper, Apex, IndicXlit, M2M100, FFmpeg). The `times` job
# puts both architectures side by side in the run's summary.
name: arm64

on:
  push:
    branches: [main]
    paths:
      - docker-compose.prod.yml
      - docker-compose.gpu.yml
      - install/**
      - backend/Dockerfile
      - backend/constraints.txt
      - backend/pyproject.toml
      - frontend/Dockerfile
      - frontend/package-lock.json
      - scripts/ci_arch_check.sh
      - scripts/ci_smoke.py
      - .github/workflows/arm64.yml
  pull_request:
    paths:
      - docker-compose.prod.yml
      - docker-compose.gpu.yml
      - install/**
      - backend/Dockerfile
      - backend/constraints.txt
      - backend/pyproject.toml
      - frontend/Dockerfile
      - frontend/package-lock.json
      - scripts/ci_arch_check.sh
      - scripts/ci_smoke.py
      - .github/workflows/arm64.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    name: install (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build, install, check and time this commit on ${{ matrix.arch }}
        run: bash scripts/ci_arch_check.sh ${{ matrix.arch }} "$RUNNER_TEMP/times-${{ matrix.arch }}.json"

      - name: Keep the times for the comparison
        if: success()
        run: cp "$RUNNER_TEMP/times-${{ matrix.arch }}.json" "times-${{ matrix.arch }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: times-${{ matrix.arch }}
          path: times-${{ matrix.arch }}.json
          retention-days: 30

      - name: Logs
        if: failure()
        run: |
          cd "$RUNNER_TEMP/vcm" 2>/dev/null && docker compose -p vcm --env-file .env -f docker-compose.prod.yml logs --tail 120 || true

  times:
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: times-*
          merge-multiple: true

      - name: amd64 and arm64 side by side
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          runs = {a: json.load(open(f"times-{a}.json")) for a in ("amd64", "arm64")}
          print("| | amd64 | arm64 |\n|---|---|---|")
          print(f"| speech model | {runs['amd64']['whisper']} | {runs['arm64']['whisper']} |")
          for part in ("backend", "frontend"):
              print(f"| build {part} (s) | {runs['amd64']['build_s'][part]} | {runs['arm64']['build_s'][part]} |")
          for step, amd in runs["amd64"]["steps"].items():
              arm = runs["arm64"]["steps"][step]
              key = "without_downloads_s" if "without_downloads_s" in amd else "total_s"
              note = " (without model downloads)" if key == "without_downloads_s" else ""
              print(f"| {step}{note} (s) | {amd[key]} | {arm[key]} |")
          EOF
