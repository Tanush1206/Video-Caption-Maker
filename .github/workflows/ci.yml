# Checks on every push and pull request: frontend lint/types/build, the
# installer scripts, and the backend's lint and test suite.
name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI builds and tests, and never writes (launch audit S7).
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""

  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and lint
        run: |
          bash -n install/install.sh install/vcm install/tests/test_vcm_pull.sh install/tests/test_vcm_update.sh install/tests/test_vcm_doctor.sh
          shellcheck -S warning install/install.sh install/vcm install/tests/test_vcm_pull.sh install/tests/test_vcm_update.sh install/tests/test_vcm_doctor.sh
      - name: vcm pull tries again and names HTTPS scanning (v1.3.1)
        run: |
          bash install/tests/test_vcm_pull.sh
          pwsh -NoProfile -File install/tests/test_vcm_pull.ps1
      - name: vcm update hands over safely to the version it downloaded (v1.4.0)
        run: |
          bash install/tests/test_vcm_update.sh
          pwsh -NoProfile -File install/tests/test_vcm_update.ps1
      - name: vcm doctor leaves every secret out (v1.4.0)
        run: |
          bash install/tests/test_vcm_doctor.sh
          pwsh -NoProfile -File install/tests/test_vcm_doctor.ps1
      - name: A stopped Windows install ends with its own message, no error block (v1.4.1)
        run: pwsh -NoProfile -File install/tests/test_install_stop.ps1
      - name: Compose files are valid
        run: |
          POSTGRES_PASSWORD=x JWT_SECRET_KEY=x docker compose -f docker-compose.prod.yml config -q
          POSTGRES_PASSWORD=x JWT_SECRET_KEY=x docker compose -f docker-compose.prod.yml -f docker-compose.gpu.yml config -q
      - name: Only the CUDA images are asked for as amd64; the rest are native (v1.4.0)
        run: |
          for files in "-f docker-compose.prod.yml" "-f docker-compose.prod.yml -f docker-compose.gpu.yml"; do
            # shellcheck disable=SC2086
            POSTGRES_PASSWORD=x JWT_SECRET_KEY=x docker compose $files config --format json | FILES="$files" python3 -c '
          import json, os, sys
          services = json.load(sys.stdin)["services"]
          platforms = {name: s.get("platform") for name, s in services.items()}
          print(os.environ["FILES"], platforms)
          cuda = "gpu" in os.environ["FILES"]
          for name in ("backend", "worker"):
              assert platforms[name] == ("linux/amd64" if cuda else None), platforms
          assert all(platforms[n] is None for n in ("frontend", "postgres", "redis", "chromadb")), platforms
          '
          done
      - name: Dev stack builds the CPU image unless the GPU is asked for
        run: |
          touch .env
          docker compose -f docker-compose.yml config | grep -q 'VARIANT: cpu'
          if docker compose -f docker-compose.yml config | grep -q 'VARIANT: cuda'; then exit 1; fi
          VCM_VARIANT=cuda docker compose -f docker-compose.yml -f docker-compose.gpu.yml config | grep -q 'VARIANT: cuda'

  backend:
    runs-on: ubuntu-24.04
    # The suite talks to real Postgres, Redis and ChromaDB, and renders with
    # FFmpeg and the caption fonts, so it runs in the backend's own dev image
    # against service containers rather than on the bare runner.
    services:
      postgres:
        image: postgres:16.14-alpine
        env:
          POSTGRES_USER: vcm
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: vcm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vcm" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.10-alpine
        ports: ["6379:6379"]
      chromadb:
        image: chromadb/chroma:1.0.0
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the dev image (CPU)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          target: dev
          load: true
          tags: vcm-backend-dev:ci
          build-args: VARIANT=cpu
          # Reuses the release's layers when nothing below the app changed.
          cache-from: type=registry,ref=ghcr.io/tanush1206/video-caption-maker-backend:buildcache-cpu
      - name: Lint (ruff)
        # The entrypoint drops to the image's `vcm` user, which can't write
        # the runner's checkout, so ruff runs without its cache directory.
        run: docker run --rm -v "$PWD/backend:/app" vcm-backend-dev:ci ruff check --no-cache app tests alembic scripts
      - name: Tests (pytest)
        # conftest.py redirects to vcm_test, Redis db 14 and a temp dir;
        # the URLs here only say where the services are.
        run: |
          docker run --rm --network host -v "$PWD/backend:/app" \
            -e DATABASE_URL=postgresql+asyncpg://vcm:ci-only-password@localhost:5432/vcm \
            -e REDIS_URL=redis://localhost:6379/0 \
            -e CHROMADB_URL=http://localhost:8000 \
            vcm-backend-dev:ci python -m pytest -q -p no:cacheprovider
