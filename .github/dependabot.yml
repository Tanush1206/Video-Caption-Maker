# Proposes updates to the GitHub Actions the workflows use (v1.4.0, launch
# audit S7). They are pinned to commit SHAs with the version as a comment;
# Dependabot keeps both current, as one weekly pull request to review.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
